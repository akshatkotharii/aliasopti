<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc"><title id="title">The AliasOpti workflow</title><desc id="desc">Measure, diagnose, improve, verify and report.</desc><rect width="1200" height="310" rx="24" fill="#101b2f"/><text x="56" y="70" fill="#a7bad4" font-family="Arial,sans-serif" font-size="19" font-weight="bold" letter-spacing="3">A MEASUREMENT-FIRST WORKFLOW</text><text x="56" y="120" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="bold">Make the experience faster, then prove it.</text><g font-family="Arial,sans-serif"><g fill="#213450"><rect x="56" y="163" width="195" height="91" rx="12"/><rect x="279" y="163" width="195" height="91" rx="12"/><rect x="502" y="163" width="195" height="91" rx="12"/><rect x="725" y="163" width="195" height="91" rx="12"/><rect x="948" y="163" width="195" height="91" rx="12"/></g><g fill="#76e2ca" font-size="14" font-weight="bold"><text x="75" y="193">01</text><text x="298" y="193">02</text><text x="521" y="193">03</text><text x="744" y="193">04</text><text x="967" y="193">05</text></g><g fill="#fff" font-size="21" font-weight="bold"><text x="75" y="226">Measure</text><text x="298" y="226">Diagnose</text><text x="521" y="226">Improve</text><text x="744" y="226">Verify</text><text x="967" y="226">Explain</text></g></g></svg>
